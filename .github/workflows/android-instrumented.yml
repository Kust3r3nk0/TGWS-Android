name: Android device tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/android-instrumented.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: ['36', '37.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build app and instrumentation before starting emulator
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare pinned previous APK for update regression
        run: python3 .github/scripts/check_apk_upgrade.py --prepare --serial emulator-5554 --sdk "$ANDROID_HOME" --keystore "$HOME/.android/debug.keystore"
      - name: Install stable emulator and system image
        shell: bash
        run: |
          set -euo pipefail
          # Retry SDK downloads only; test failures remain fatal and are never retried here.
          for attempt in 1 2 3; do
            echo "SDK installation attempt ${attempt}/3"
            if sdkmanager --channel=0 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'; then
              exit 0
            fi
          done
          exit 1
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android lifecycle and Keystore tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          # swiftshader_indirect was deprecated in emulator 36.4.9 and crashes
          # API 37 SurfaceFlinger (mapper.ranchu ReadColorBufferDma assertion).
          # Use the supported software backend; application tests remain unchanged.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -show-kernel
          pre-emulator-launch-script: python3 .github/scripts/configure_avd.py --api '${{ matrix.api }}'
          disable-animations: true
          script: |
            bash .github/scripts/run_android_tests.sh '${{ matrix.api }}'
            python3 .github/scripts/check_apk_upgrade.py --serial emulator-5554 --sdk "$ANDROID_HOME" --keystore "$HOME/.android/debug.keystore"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-device-test-reports-API-${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/reports/android-environment/
            app/build/reports/apk-upgrade/
          if-no-files-found: warn
          retention-days: 14
