name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, JVM tests and lint (Android API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: basic
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 37 platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK (not a stable release)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TGWS-Android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Add build details to run summary
        if: success()
        run: |
          {
            echo '### TGWS-Android Debug APK'
            echo ''
            echo 'JVM tests, Android Lint and Debug APK build completed successfully.'
            echo "Commit: \`$GITHUB_SHA\`"
            echo ''
            echo 'Download the TGWS-Android-debug-apk artifact (ZIP) from this run.'
            echo 'This is a test/debug build, not a production release.'
          } >> "$GITHUB_STEP_SUMMARY"
