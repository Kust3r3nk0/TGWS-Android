name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, JVM tests and lint (Android API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android API 37 platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check the declared native UI contract (TGWS-16-016)
        run: python3 .github/scripts/verify_native_ui.py --output app/build/reports/native-ui.json
      - name: Check Android 16+ sources, resources and documentation
        run: |
          python3 .github/scripts/verify_android_platform.py
          python3 .github/scripts/verify_public_metadata.py
      - name: Run tests, lint and debug build
        run: ./gradlew --no-daemon -PsoakSeconds=60 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check retired Cloudflare DNS is absent from the app APK
        run: python3 .github/scripts/verify_native_dns.py
      - name: Check built APK platform minimum
        run: python3 .github/scripts/verify_android_platform.py --apk app/build/outputs/apk/debug/app-debug.apk --output app/build/reports/android-platform.json
      - name: Verify instrumentation report gate tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify actual 60-second soak execution and resource limits
        run: python3 .github/scripts/verify_soak.py --seconds 60 --output app/build/reports/soak-summary.json
      - name: Verify actual 60-second native HTTP2 soak and resource limits
        run: python3 .github/scripts/verify_http2_soak.py --seconds 60 --output app/build/reports/http2-soak-summary.json
      - name: Test WSS relay with real local TLS and TCP
        working-directory: relay
        run: |
          npm ci --ignore-scripts
          npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
      - name: Test and bundle experimental Worker without deployment
        working-directory: cloudflare-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
          npm run build
      - name: Collect debug APK, checksum and build information
        if: success()
        env:
          TGWS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          output = Path('artifacts/debug')
          output.mkdir(parents=True)
          apks = sorted(Path('app/build/outputs/apk/debug').glob('*.apk'))
          if not apks:
              raise SystemExit('Debug APK is missing')
          checksums = []
          for apk in apks:
              shutil.copy2(apk, output / apk.name)
              checksums.append(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {apk.name}')
          (output / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          native_ui = json.loads(Path('app/build/reports/native-ui.json').read_text())
          info = {
              'version': version,
              'commit': os.environ['GITHUB_SHA'],
              'source_commit': os.environ['TGWS_SOURCE_COMMIT'],
              'workflow_url': run_url,
              'native_ui': native_ui,
              'build_type': 'debug',
              'signature': 'Android debug key; not a trusted distribution release',
              'jdk': '17',
              'kotlin': '2.4.21',
              'agp': '9.4.1',
              'gradle': '9.8.1',
              'compile_sdk': '37.0',
              'build_tools': '36.0.0',
              'local_soak': json.loads(Path('app/build/reports/soak-summary.json').read_text()),
              'http2_soak': json.loads(Path('app/build/reports/http2-soak-summary.json').read_text()),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'TGWS_VERSION={version}\n')
          (output / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          shutil.copy2('CHANGELOG.md', output / 'CHANGELOG.md')
          handoff = Path('docs/BUILD_INFO_TEMPLATE.md').read_text()
          for key, value in {'VERSION': version, 'BUILD_COMMIT': os.environ['GITHUB_SHA'],
                             'SOURCE_COMMIT': os.environ['TGWS_SOURCE_COMMIT'], 'RUN_URL': run_url}.items():
              handoff = handoff.replace('{{' + key + '}}', value)
          if re.search(r'\{\{[A-Z_]+\}\}', handoff):
              raise SystemExit('Build provenance contains unresolved placeholders')
          (output / 'BUILD.md').write_text(handoff)
          shutil.copy2('app/build/reports/native-ui.json', output / 'native-ui.json')
          shutil.copy2('app/build/reports/android-platform.json', output / 'android-platform.json')
          PY
      - name: Upload debug build (not a distribution release)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TGWS-Android-${{ env.TGWS_VERSION }}-debug-${{ github.sha }}
          path: artifacts/debug/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-JVM-lint-reports-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/soak-summary.json
            app/build/reports/http2-soak-summary.json
            app/build/reports/native-ui.json
            app/build/reports/android-platform.json
            relay/test-results.xml
            cloudflare-worker/test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Add build details to run summary
        if: success()
        run: |
          {
            echo '### TGWS-Android Debug APK'
            echo ''
            echo 'JVM tests, Android Lint and Debug APK build completed successfully.'
            echo "Commit: $GITHUB_SHA"
            echo ''
            echo 'Download the TGWS-Android debug artifact (ZIP) from this run.'
            echo 'This is a test/debug build, not a production release.'
          } >> "$GITHUB_STEP_SUMMARY"
