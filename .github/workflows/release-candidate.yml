name: Signed production candidate (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    # Configure required owner reviewers for this environment before adding secrets.
    environment: production-signing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and verify trusted signed candidate
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TGWS_RELEASE_KEYSTORE_BASE64 }}
          TGWS_RELEASE_STORE_PASSWORD: ${{ secrets.TGWS_RELEASE_STORE_PASSWORD }}
          TGWS_RELEASE_KEY_ALIAS: ${{ secrets.TGWS_RELEASE_KEY_ALIAS }}
          TGWS_RELEASE_KEY_PASSWORD: ${{ secrets.TGWS_RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.TGWS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 TGWS_RELEASE_STORE_PASSWORD TGWS_RELEASE_KEY_ALIAS TGWS_RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
            if [[ -z ${!name} ]]; then echo "Missing required production signing input: $name" >&2; exit 1; fi
          done
          export TGWS_RELEASE_STORE_FILE="$RUNNER_TEMP/tgws-production.keystore"
          trap 'rm -f "$TGWS_RELEASE_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$TGWS_RELEASE_STORE_FILE"
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          mkdir -p artifacts/production-candidate
          python3 .github/scripts/verify_release_apk.py --apk app/build/outputs/apk/release/app-release.apk --sdk "$ANDROID_HOME" --certificate "$RELEASE_CERT_SHA256" --output artifacts/production-candidate/verification.json
          cp app/build/outputs/apk/release/app-release.apk artifacts/production-candidate/TGWS-Android-0.4.0.apk
          python3 .github/scripts/create_update_manifest.py --apk-name TGWS-Android-0.4.0.apk --channel STABLE --output artifacts/production-candidate/update-manifest.json
          cp CHANGELOG.md artifacts/production-candidate/CHANGELOG-RU.md
          cp docs/en/CHANGELOG.md artifacts/production-candidate/CHANGELOG-EN.md
          cp docs/releases/0.4.0.md artifacts/production-candidate/RELEASE-NOTES-RU.md
          cp docs/en/releases/0.4.0.md artifacts/production-candidate/RELEASE-NOTES-EN.md
          git rev-parse HEAD > artifacts/production-candidate/SOURCE-COMMIT
          cd artifacts/production-candidate
          sha256sum TGWS-Android-0.4.0.apk update-manifest.json CHANGELOG-*.md RELEASE-NOTES-*.md verification.json SOURCE-COMMIT > SHA256SUMS
      - name: Upload candidate for owner testing (does not publish a Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TGWS-Android-0.4.0-production-candidate-${{ github.sha }}
          path: artifacts/production-candidate/
          if-no-files-found: error
          retention-days: 14
