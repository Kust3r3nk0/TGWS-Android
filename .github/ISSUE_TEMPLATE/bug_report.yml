name: Bug report
description: Report a reproducible problem in TGWS-Android
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact proxy secrets and personal information before sharing logs. This is an alpha project."
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: 0.1.0-alpha / SHA
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Device / Android version
      placeholder: Android 14, 15, 16, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include keys or personal logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
