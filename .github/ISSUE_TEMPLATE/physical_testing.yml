name: Отчёт физического тестирования
description: Результаты проверки сборки владельцем на смартфоне (TGWS-16-017)
body:
  - type: markdown
    attributes:
      value: |
        Физические результаты подтверждает владелец. Не публикуйте secret, ключи, relay URL,
        сообщения, SIM/IMEI/serial и полную конфигурацию. Проверка CI не заменяет этот отчёт.
        В TGWS 0.3.4 встроенный WebView не используется; указывайте среду, не выдумывая тест веб-страницы.
  - type: input
    id: build
    attributes:
      label: Версия и commit SHA
      description: Из OWNER_HANDOFF.md / build-info.json именно скачанной сборки.
      placeholder: 0.3.4-alpha / source SHA / checked tree SHA
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Ссылка на Actions или Debug Pre-release
  - type: input
    id: device
    attributes:
      label: Производитель, модель, Android/API и One UI
      description: One UI укажите с экрана ПО или «неприменимо»; без персональных идентификаторов.
    validations:
      required: true
  - type: input
    id: telegram
    attributes:
      label: Версия Telegram, сеть, оператор/регион
  - type: dropdown
    id: webview_channel
    attributes:
      label: Выбранный WebView-канал
      options:
        - Неизвестно / не проверялось
        - Stable
        - Beta
        - Dev (дополнительно)
        - Canary (экспериментально)
        - AOSP / другой провайдер
        - Провайдер недоступен
  - type: input
    id: webview_version
    attributes:
      label: WebView package / точная версия
      description: Имя пакета не подтверждает последнее обновление. Укажите, проверяли ли актуальность.
  - type: textarea
    id: results
    attributes:
      label: Сценарии и фактическое поведение
      value: |
        Дата:
        Режим/тип транспорта (без URL и ключей):
        Telegram: отправка/получение/загрузка:
        Задержка (метод измерения), длительность/разрывы:
        Wi-Fi и мобильная сеть, восстановление:
        SNI/Fake TLS/Cloudflare:
        One UI / Live Updates / Quick Settings (если реализованы):
        Stable/Beta, обновление WebView, настройки и сервис до/после:
        Статусы: не проверено / пройдено / ошибка / не поддерживается / неприменимо.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Ошибка — шаги, ожидалось, получилось
      description: Укажите частоту и зависимость от среды. Скриншоты/обезличенный экспорт сначала проверьте на секреты.
