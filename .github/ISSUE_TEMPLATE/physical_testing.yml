name: Отчёт физического тестирования
description: Результаты проверки сборки владельцем на смартфоне (TGWS-16-017)
body:
  - type: markdown
    attributes:
      value: |
        Физические результаты подтверждает владелец. Не публикуйте secret, ключи, relay URL,
        сообщения, SIM/IMEI/serial и полную конфигурацию. Проверка CI не заменяет этот отчёт.
        Базовые результаты 0.3.6 уже записаны в docs/OWNER_VALIDATION_0.3.6.md. Укажите новую проверку или уточнение. Встроенного WebView нет; renderer/page тесты неприменимы.
  - type: input
    id: build
    attributes:
      label: Версия и commit SHA
      description: Из OWNER_HANDOFF.md / build-info.json именно скачанной сборки.
      placeholder: 0.3.7-alpha / source SHA / checked tree SHA
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Ссылка на Actions или Debug Pre-release
  - type: input
    id: device
    attributes:
      label: Производитель, модель, Android/API и One UI
      description: One UI укажите с экрана ПО или «неприменимо»; без персональных идентификаторов.
    validations:
      required: true
  - type: input
    id: telegram
    attributes:
      label: Версия Telegram, сеть, оператор/регион
  - type: input
    id: webview_version
    attributes:
      label: WebView package/version — только для связанного с обновлением провайдера сбоя
      description: Необязательное поле; нативный MTProto не использует WebView.
  - type: textarea
    id: results
    attributes:
      label: Сценарии и фактическое поведение
      value: |
        Дата:
        Режим/тип транспорта (без URL и ключей):
        Повторный start/stop: шаги и результат:
        Wi-Fi ↔ мобильная сеть: восстановилось само / нужен перезапуск:
        HD-фото и видеокружки: режим, отправка/скачивание, результат:
        Длительность работы и разрывы:
        Файл 1–5 МиБ: результат или не проверял:
        Другие проверенные функции:
        Статусы: не проверено / пройдено / ошибка / не поддерживается / неприменимо.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Ошибка — шаги, ожидалось, получилось
      description: Укажите частоту и зависимость от среды. Скриншоты/обезличенный экспорт сначала проверьте на секреты.
